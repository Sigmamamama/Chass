
name: Build Chess Assistant APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir source
          unzip ChessAssistant-Overlay-v2-Android.zip -d source

      - name: Build APK
        run: |
          gradle -p source \
            -Pkotlin.jvm.target.validation.mode=warning \
            :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessAssistant-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
